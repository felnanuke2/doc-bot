name: Pull Request CI

on:
  pull_request:
    branches: [ main, develop ]

env:
  SCHEME: "doc-bot"
  DESTINATION: "platform=iOS Simulator,name=iPhone 16 Pro,OS=18.5"
  
jobs:
  test-pr:
    name: PR Tests and Coverage
    runs-on: macos-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
    
    - name: Setup Ruby
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: '3.1'
        bundler-cache: true
    
    - name: Install dependencies
      run: bundle install
    
    - name: Select Xcode version
      run: sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer
    
    - name: Cache build artifacts
      uses: actions/cache@v3
      with:
        path: |
          ~/Library/Developer/Xcode/DerivedData
          ./build
        key: ${{ runner.os }}-xcode-pr-${{ hashFiles('**/project.pbxproj') }}
        restore-keys: |
          ${{ runner.os }}-xcode-pr-
          ${{ runner.os }}-xcode-
    
    - name: Clean and run tests
      run: |
        set -o pipefail
        xcodebuild clean test \
          -scheme "${{ env.SCHEME }}" \
          -destination "${{ env.DESTINATION }}" \
          -enableCodeCoverage YES \
          -derivedDataPath ./build/DerivedData \
          CODE_SIGN_IDENTITY="" \
          CODE_SIGNING_REQUIRED=NO \
          ONLY_ACTIVE_ARCH=NO \
          | xcpretty --report junit --output ./build/reports/junit.xml
    
    - name: Generate coverage with Slather (using config file)
      run: |
        mkdir -p ./build/reports
        slather coverage
    
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v4
      with:
        file: ./build/reports/cobertura.xml
        flags: pr-tests
        name: pr-coverage
        fail_ci_if_error: false
        verbose: true
        env_vars: OS,PYTHON
      env:
        CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
    
    - name: Comment PR with coverage
      uses: actions/github-script@v7
      if: github.event_name == 'pull_request'
      with:
        script: |
          const fs = require('fs');
          try {
            const coverage = fs.readFileSync('./build/reports/cobertura.xml', 'utf8');
            // You can parse the XML and extract coverage percentage here
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '🧪 Tests completed! Coverage report has been uploaded to Codecov.'
            });
          } catch (error) {
            console.log('Could not read coverage file:', error);
          }
