name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

env:
  SCHEME: "doc-bot"
  DESTINATION: "platform=iOS Simulator,name=iPhone 16 Pro,OS=18.5"
  
jobs:
  test:
    name: Run Tests and Generate Coverage
    runs-on: macos-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
    
    - name: Setup Ruby
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: '3.1'
        bundler-cache: true
    
    - name: Install dependencies
      run: |
        bundle install
        gem install xcpretty
    
    - name: Select Xcode version
      run: sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer
    
    - name: Show available simulators
      run: xcrun simctl list devices available
    
    - name: Create iOS Simulator
      run: |
        xcrun simctl create "iPhone 16 Pro Test" "iPhone 16 Pro" "iOS18.5" || true
        xcrun simctl boot "iPhone 16 Pro Test" || true
    
    - name: Cache build artifacts
      uses: actions/cache@v3
      with:
        path: |
          ~/Library/Developer/Xcode/DerivedData
          ./build
        key: ${{ runner.os }}-xcode-${{ hashFiles('**/project.pbxproj') }}
        restore-keys: |
          ${{ runner.os }}-xcode-
    
    - name: Clean build directory
      run: |
        rm -rf build/
        xcodebuild clean -scheme "${{ env.SCHEME }}" -destination "${{ env.DESTINATION }}"
    
    - name: Run tests with coverage
      run: |
        set -o pipefail
        xcodebuild test \
          -scheme "${{ env.SCHEME }}" \
          -destination "${{ env.DESTINATION }}" \
          -enableCodeCoverage YES \
          -derivedDataPath ./build/DerivedData \
          CODE_SIGN_IDENTITY="" \
          CODE_SIGNING_REQUIRED=NO \
          ONLY_ACTIVE_ARCH=NO \
          | xcpretty --report junit --output ./build/reports/junit.xml
    
    - name: Generate coverage report with Slather
      run: |
        mkdir -p ./build/reports
        slather coverage
    
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v4
      with:
        file: ./build/reports/cobertura.xml
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: true
        verbose: true
      env:
        CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
    
    - name: Upload test results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: test-results
        path: |
          ./build/reports/
          ./build/DerivedData/Logs/Test/
    
    - name: Publish test results
      uses: EnricoMi/publish-unit-test-result-action/composite@v2
      if: always()
      with:
        files: ./build/reports/junit.xml
        check_name: "Test Results"
        comment_title: "Unit Test Results"
