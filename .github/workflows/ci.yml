name: CI - Tests and Build

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch: # Allow manual trigger

jobs:
  test:
    name: Run Tests
    runs-on: macos-14
    timeout-minutes: 30
    
    strategy:
      matrix:
        xcode-version: ['15.0']
        ios-version: ['17.0']
        device: ['iPhone 15']
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: recursive
        lfs: true
    
    - name: Setup Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: ${{ matrix.xcode-version }}
    
    - name: Show environment info
      run: |
        echo "Xcode version:"
        xcodebuild -version
        echo -e "\nSwift version:"
        swift --version
        echo -e "\nAvailable simulators:"
        xcrun simctl list devices available | grep -E "(iPhone|iPad)"
    
    - name: Cache SPM dependencies
      uses: actions/cache@v4
      with:
        path: |
          ~/Library/Developer/Xcode/DerivedData/**/SourcePackages
          ~/Library/Caches/org.swift.swiftpm
        key: ${{ runner.os }}-spm-${{ hashFiles('**/Package.resolved', '**/project.pbxproj') }}
        restore-keys: |
          ${{ runner.os }}-spm-
    
    - name: Resolve Swift Package dependencies
      run: |
        xcodebuild \
          -project doc-bot.xcodeproj \
          -resolvePackageDependencies
    
    - name: Build for testing
      run: |
        xcodebuild \
          -project doc-bot.xcodeproj \
          -scheme doc-bot \
          -destination 'platform=iOS Simulator,name=${{ matrix.device }},OS=${{ matrix.ios-version }}' \
          -configuration Debug \
          clean build-for-testing \
          -quiet
    
    - name: Run Unit Tests
      run: |
        xcodebuild \
          -project doc-bot.xcodeproj \
          -scheme doc-bot \
          -destination 'platform=iOS Simulator,name=${{ matrix.device }},OS=${{ matrix.ios-version }}' \
          -configuration Debug \
          test-without-building \
          -only-testing:doc-botTests \
          -enableCodeCoverage YES \
          -resultBundlePath TestResults.xcresult
    
    - name: Run UI Tests
      run: |
        xcodebuild \
          -project doc-bot.xcodeproj \
          -scheme doc-bot \
          -destination 'platform=iOS Simulator,name=${{ matrix.device }},OS=${{ matrix.ios-version }}' \
          -configuration Debug \
          test-without-building \
          -only-testing:doc-botUITests \
          -resultBundlePath UITestResults.xcresult
      continue-on-error: true # UI tests might be flaky
    
    - name: Parse test results
      if: always()
      run: |
        if [ -d "TestResults.xcresult" ]; then
          xcrun xcresulttool get --format json --path TestResults.xcresult > test_results.json
          echo "Unit test results generated"
        fi
        
        if [ -d "UITestResults.xcresult" ]; then
          xcrun xcresulttool get --format json --path UITestResults.xcresult > ui_test_results.json
          echo "UI test results generated"
        fi
    
    - name: Upload test results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: test-results-${{ matrix.device }}-${{ matrix.ios-version }}
        path: |
          TestResults.xcresult
          UITestResults.xcresult
          test_results.json
          ui_test_results.json
        retention-days: 30
    
    - name: Generate test summary
      if: always()
      run: |
        echo "## Test Results Summary" >> $GITHUB_STEP_SUMMARY
        echo "- **Device**: ${{ matrix.device }}" >> $GITHUB_STEP_SUMMARY
        echo "- **iOS Version**: ${{ matrix.ios-version }}" >> $GITHUB_STEP_SUMMARY
        echo "- **Xcode Version**: ${{ matrix.xcode-version }}" >> $GITHUB_STEP_SUMMARY
        
        if [ -f "test_results.json" ]; then
          echo "- **Unit Tests**: ✅ Results available" >> $GITHUB_STEP_SUMMARY
        else
          echo "- **Unit Tests**: ❌ No results found" >> $GITHUB_STEP_SUMMARY
        fi
        
        if [ -f "ui_test_results.json" ]; then
          echo "- **UI Tests**: ✅ Results available" >> $GITHUB_STEP_SUMMARY
        else
          echo "- **UI Tests**: ❌ No results found" >> $GITHUB_STEP_SUMMARY
        fi
