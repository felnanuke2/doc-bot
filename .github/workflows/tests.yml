name: CI & Code Coverage

# Controls when the workflow will run
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-report-coverage:
    # The type of runner that the job will run on
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Set up Ruby environment to install Slather
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.1' # Or the version you prefer
          bundler-cache: true # Caches gems for faster builds

      # 3. Select active Xcode version
      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.2'

      # 4. List available simulators (for debugging)
      - name: List available simulators
        run: xcrun simctl list devices available

      # 5. Run tests and generate coverage data
      - name: Run tests
        run: |
          xcodebuild test \
            -project doc-bot.xcodeproj \
            -scheme doc-bot \
            -destination 'platform=iOS Simulator,name=iPhone 16' \
            -configuration Debug \
            -derivedDataPath build \
            -enableCodeCoverage YES \
            clean test | bundle exec xcpretty

      # 6. Debug build directory (optional)
      - name: Debug build directory
        run: |
          echo "Build directory contents:"
          find build -type f -name "*.profdata" 2>/dev/null || echo "No .profdata files found"
          find build -type f -name "*.xcresult" 2>/dev/null || echo "No .xcresult files found"
          ls -la build/ 2>/dev/null || echo "Build directory not found"

      # 7. Run Slather to generate coverage report
      - name: Generate coverage report
        run: |
          if [ -d "build" ] && find build -name "*.profdata" -print -quit | grep -q .; then
            bundle exec slather coverage \
              --cobertura-xml \
              --output-directory reports \
              --build-directory build \
              --scheme doc-bot \
              doc-bot.xcodeproj
          else
            echo "No coverage data found. Tests may have failed or coverage was not generated."
            exit 1
          fi

      # 8. Upload coverage to Codecov
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          file: reports/cobertura.xml
          fail_ci_if_error: true
          verbose: true
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

      # 9. Upload coverage report artifact
      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: code-coverage-report
          path: reports/