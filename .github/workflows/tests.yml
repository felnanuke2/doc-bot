name: Tests
on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    name: Run All Tests
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          
      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.4'
          
      - name: Run Tests with Coverage
        run: |
          xcodebuild \
            -project doc-bot.xcodeproj \
            -scheme doc-bot \
            -destination 'platform=iOS Simulator,name=iPhone 16,OS=18.5' \
            -enableCodeCoverage YES \
            -only-testing:doc-botTests \
            -derivedDataPath ./build \
            clean test
            
      - name: Install Slather
        run: gem install slather
          
      - name: Generate Coverage Report
        run: |
          # Debug: Show build directory structure
          echo "Build directory structure:"
          find ./build -type d -name "*ProfileData*" || echo "No ProfileData found"
          find ./build -name "doc-bot" -type f || echo "No doc-bot binary found"
          find ./build -name "*.app" || echo "No .app found"
          
          # Generate coverage report with correct binary path
          slather coverage --cobertura-xml \
                          --scheme doc-bot \
                          --build-directory ./build \
                          --binary-file ./build/Build/Products/Variant-NoSanitizers/Debug-iphonesimulator/doc-bot.app/doc-bot \
                          doc-bot.xcodeproj
                          
          # Verify output file was created
          if [ -f "cobertura.xml" ]; then
            echo "Coverage report generated successfully"
            ls -la cobertura.xml
          else
            echo "ERROR: Coverage report not generated"
            exit 1
          fi
          
      - name: Upload Coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          name: codecov-umbrella
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./cobertura.xml
          fail_ci_if_error: false
          verbose: true