name: Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    name: Run All Tests
    runs-on: macos-15
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        submodules: recursive
    
    - name: Setup Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: '16.2'
    
    - name: Run Tests with Coverage
      run: |
        xcodebuild \
          -project doc-bot.xcodeproj \
          -scheme doc-bot \
          -destination 'platform=iOS Simulator,name=iPhone 16,OS=18.5' \
          -enableCodeCoverage YES \
          -derivedDataPath ./build \
          clean test
    
    - name: Generate Coverage Report
      run: |
        xcrun xccov view --report --json ./build/Logs/Test/*.xcresult > coverage.json
        
    - name: Convert Coverage to Cobertura
      run: |
        # Create virtual environment and install xccov-to-cobertura-xml
        python3 -m venv venv
        source venv/bin/activate
        pip install xccov-to-cobertura-xml
        xccov-to-cobertura-xml coverage.json > coverage.xml
    
    - name: Upload Coverage to Codecov
      uses: codecov/codecov-action@v4
      with:
        file: ./coverage.xml
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false
        token: ${{ secrets.CODECOV_TOKEN }}
