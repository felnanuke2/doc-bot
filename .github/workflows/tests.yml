name: CI & Code Coverage

# Controls when the workflow will run
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-report-coverage:
    # The type of runner that the job will run on
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Set up Ruby environment to install Slather
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.1' # Or the version you prefer
          bundler-cache: true # Caches gems for faster builds

      # 3. Select active Xcode version
      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.2'

      # 4. Run tests and generate coverage data
      - name: Run tests
        run: |
          xcodebuild test \
            -project doc-bot.xcodeproj \
            -scheme doc-bot \
            -destination 'platform=iOS Simulator,name=iPhone 16,OS=18.4' \
            -enableCodeCoverage YES \
            clean test | xcpretty

      # 5. Run Slather to generate coverage report
      - name: Generate coverage report
        run: bundle exec slather coverage --cobertura-xml --output-directory reports

      # 6. Upload coverage to Codecov
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          file: reports/cobertura.xml
          fail_ci_if_error: true
          verbose: true
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

      # 7. Upload coverage report artifact
      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: code-coverage-report
          path: reports/