name: Tests
on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    name: Run All Tests
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          
      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.4'
          
      - name: Build and Test with Coverage
        run: |
          xcodebuild \
            -project doc-bot.xcodeproj \
            -scheme doc-bot \
            -destination 'platform=iOS Simulator,name=iPhone 16,OS=18.5' \
            -enableCodeCoverage YES \
            -only-testing:doc-botTests \
            -resultBundlePath TestResults.xcresult \
            clean build test \
            ONLY_ACTIVE_ARCH=YES \
            EXCLUDED_ARCHS="x86_64" \
            ARCHS=arm64
          
      - name: Convert Coverage to JSON
        run: |
          mkdir -p coverage
          if [ -d "TestResults.xcresult" ]; then
            echo "Converting coverage from: TestResults.xcresult"
            xcrun xccov view --report --json TestResults.xcresult > coverage/coverage.json
            echo "Coverage report generated at coverage/coverage.json"
          else
            echo "Error: TestResults.xcresult not found"
            exit 1
          fi
          
      - name: Debug Coverage Files
        run: |
          echo "Coverage directory contents:"
          ls -la coverage/
          echo "Coverage file size:"
          wc -l coverage/coverage.json
          echo "First few lines of coverage file:"
          head -20 coverage/coverage.json
          
      - name: Upload Coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: coverage/coverage.json
          name: codecov-umbrella
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: true
          verbose: true
          
      - name: Upload Coverage to Coveralls
        uses: coverallsapp/github-action@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}