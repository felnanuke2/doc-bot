name: Tests
on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    name: Run All Tests
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          
      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.4'
          
      - name: Build and Test with Coverage
        run: |
          xcodebuild test \
            -project doc-bot.xcodeproj \
            -scheme doc-bot \
            -destination 'platform=iOS Simulator,name=iPhone 16,OS=18.5,arch=arm64' \
            -enableCodeCoverage YES \
            -only-testing:doc-botTests \
            clean build test \
            ARCHS=arm64
          
      - name: Convert Coverage to JSON
        run: |
          mkdir -p coverage
          # Find the most recent .xcresult bundle
          XCRESULT_PATH=$(find ~/Library/Developer/Xcode/DerivedData -name "*.xcresult" -type d | head -1)
          if [ -z "$XCRESULT_PATH" ]; then
            echo "No .xcresult found, checking build directory..."
            XCRESULT_PATH=$(find ./build -name "*.xcresult" -type d | head -1)
          fi
          if [ -n "$XCRESULT_PATH" ]; then
            echo "Converting coverage from: $XCRESULT_PATH"
            xcrun xccov view --report --json "$XCRESULT_PATH" > coverage/coverage.json
            echo "Coverage report generated at coverage/coverage.json"
          else
            echo "Error: No .xcresult bundle found"
            exit 1
          fi
          
      - name: Debug Coverage Files
        run: |
          echo "Coverage directory contents:"
          ls -la coverage/
          echo "Coverage file size:"
          wc -l coverage/coverage.json
          echo "First few lines of coverage file:"
          head -20 coverage/coverage.json
          
      - name: Upload Coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: coverage/coverage.json
          name: codecov-umbrella
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: true
          verbose: true
          
      - name: Upload Coverage to Coveralls
        uses: coverallsapp/github-action@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}