name: Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    name: Run All Tests
    runs-on: macos-15
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        submodules: recursive
    
    - name: Setup Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: '16.2'
    
    - name: Run Tests with Coverage
      run: |
        xcodebuild \
          -project doc-bot.xcodeproj \
          -scheme doc-bot \
          -destination 'platform=iOS Simulator,name=iPhone 16,OS=18.5' \
          -enableCodeCoverage YES \
          -derivedDataPath ./build \
          -only-testing:doc-botTests/ImportedDocumentsViewModelTests \
          clean test
    
    - name: Generate Coverage Report
      run: |
        # Find the xcresult bundle
        XCRESULT_PATH=$(find ./build -name "*.xcresult" | head -1)
        echo "Found xcresult at: $XCRESULT_PATH"
        
        if [ -n "$XCRESULT_PATH" ]; then
          # Generate coverage report in JSON format
          xcrun xccov view --report --json "$XCRESULT_PATH" > coverage.json
          echo "Generated coverage.json"
          
          # Also generate human-readable coverage report
          xcrun xccov view --report "$XCRESULT_PATH" > coverage.txt
          echo "Generated coverage.txt"
          
          # List files for debugging
          echo "Files in build directory:"
          find ./build -name "*.xccovreport" -o -name "*.xccovarchive" -o -name "*.xcresult"
        else
          echo "No xcresult file found"
          exit 1
        fi
    
    - name: Upload Coverage to Codecov
      uses: codecov/codecov-action@v4
      with:
        file: coverage.json
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false
        token: ${{ secrets.CODECOV_TOKEN }}
        verbose: true
