# Slather Configuration
# Coverage tool configuration for doc-bot iOS project

# Project settings
xcodeproj: doc-bot.xcodeproj
scheme: doc-bot
workspace: doc-bot.xcodeproj

# Output configuration
output_directory: ./build/reports
coverage_service: cobertura_xml
cobertura_xml: true

# Coverage settings
arch: x86_64
configuration: Debug

# Build directory for derived data
build_directory: ./build/DerivedData

# Ignore patterns - exclude test files, external dependencies, and resources
ignore:
  - "../**/Pods/*"
  - "**/Pods/*"
  - "**/*Tests*"
  - "**/*Test*"
  - "**/build/*"
  - "**/LlamaCpp/*"
  - "**/Resources/*"
  - "**/Assets.xcassets/*"
  - "**/DerivedData/*"
  - "**/Preview Content/*"
  - "doc-botTests/*"
  - "doc-botUITests/*"

# Include only source files from main target
source_directory: doc-bot/

# Binary basename (matches your app target)
binary_basename: doc-bot